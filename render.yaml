databases:
  - name: kairos-builder-portal-db
    plan: free

services:
  - type: web
    name: kairos-builder-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: kairos-builder-portal-db
          property: connectionString
